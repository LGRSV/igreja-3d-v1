<title>Igreja 3D — Base Church</title>
<meta name="description" content="Planta 3D interativa da Base Church (Palmas-TO): gire, dê zoom e comande luzes, telão, som e ar por ambiente.">
<style>
  :root {

  }

    width: min(380px, calc(100vw - 24px)); padding: 4px 6px 4px 11px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; grid-template-areas: "time track btn hide"; align-items: center; column-gap: 8px;
    background: rgba(10, 15, 30, .78); border: 1px solid rgba(255, 255, 255, .09); border-radius: 12px; color: #e6edf7;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
    font: 12px/1.25 -apple-system, BlinkMacSystemFont, Roboto, "Segoe UI", sans-serif; transition: opacity .2s; }

  .sky output { font-size: 16px; font-weight: 700; line-height: 1; letter-spacing: .01em; font-variant-numeric: tabular-nums; color: #f3f6fc; }

  .sky-cap { margin-top: 2px; font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: #8f9bb3; white-space: nowrap; }
  .sky-track { grid-area: track; position: relative; height: 32px; min-width: 0; }
  .sky-bar { position: absolute; left: 11px; right: 11px; top: 6px; height: 8px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); }
  .sky-mark { position: absolute; top: 21px; left: calc(11px + (100% - 22px) * var(--f)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .sky-mark i { position: absolute; top: -7px; width: 1px; height: 5px; background: rgba(255, 255, 255, .35); }
  .sky-mark em { font-style: normal; font-size: 8.5px; font-weight: 600; color: #8f9bb3; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sky-mark em b { color: var(--amber); font-weight: 700; margin-right: 2px; }
  .sky input[type=range] { position: absolute; left: 0; top: 0; width: 100%; height: 20px; margin: 0; padding: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; touch-action: none; }
  .sky input[type=range]::-webkit-slider-runnable-track { height: 20px; background: transparent; border: 0; }
  .sky input[type=range]::-moz-range-track { height: 20px; background: transparent; border: 0; }
  .sky input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 20px; background: transparent; border: 0; }

    display: flex; align-items: center; justify-content: center; background: #0a0f1e; border: 2px solid var(--amber); color: var(--amber);

  .sky-thumb svg { width: 11px; height: 11px; display: block; }
  .sky-thumb .moon { display: none; } .sky-thumb.night { border-color: #9db6ee; color: #b9ccf5; box-shadow: 0 0 0 3px rgba(157, 182, 238, .14), 0 2px 8px rgba(0, 0, 0, .5); }
  .sky-thumb.night .sun { display: none; } .sky-thumb.night .moon { display: block; }
  .sky input[type=range]:focus-visible ~ .sky-thumb { box-shadow: 0 0 0 2px #0a0f1e, 0 0 0 4px var(--amber); }

  .sky-live:hover { background: rgba(255, 255, 255, .12); }

  @keyframes skypulse { 0% { box-shadow: 0 0 0 0 rgba(75, 227, 139, .6); } 70%, 100% { box-shadow: 0 0 0 7px rgba(75, 227, 139, 0); } }
  @media (prefers-reduced-motion: reduce) { .sky-live.on .dot { animation: none; } }
  /* ocultar: a faixa vira só uma pílula com a hora; clicar nela (ou no botão) mostra de novo */
  .sky-hide { grid-area: hide; appearance: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .06); color: #aab4c8; cursor: pointer; }
  .sky-hide:hover { background: rgba(255, 255, 255, .14); color: #e6edf7; }
  .sky-hide:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .sky.min { width: auto; grid-template-columns: auto auto; grid-template-areas: "time hide"; padding: 3px 4px 3px 10px; cursor: pointer; }
  .sky.min .sky-track, .sky.min .sky-live, .sky.min .sky-cap { display: none; }

  .sky.min output { font-size: 13px; }
  .sky.min .sky-hide svg { transform: rotate(180deg); }
  @media (max-width: 560px) {
    .sky { width: min(360px, calc(100vw - 24px)); }
    .sky-cap { display: none; }
  }
</style>

<script type="module">

const autos = [['automation.fachada_no_por_do_sol', 'Fachada acende no pôr do sol', 95], ['automation.ar_templo_antes_do_culto', 'Ar do templo 1 h antes do culto', 55],
  ['automation.abrir_igreja_domingo', 'Abrir a igreja (domingo 17h30)', 100], ['automation.presenca_acende_hall', 'Presença acende o hall', 70],
  ['automation.fechar_tudo_meia_noite', 'Fechar tudo à meia-noite', 1400], ['automation.expediente_seg_sex', 'Expediente (seg–sex 8h)', 700],

const toastEl = document.getElementById('toast'); let toastT = 0;

function callService(domain, service, data) {

  const id = data && data.entity_id; const s = states[id]; if (!s) return;

  const isClimate = id.startsWith('climate.');

    if (data.brightness != null) attrs.brightness = data.brightness;

  else if (service === 'set_hvac_mode') later(() => set(data.hvac_mode));

  else if (service === 'media_play_pause') later(() => set(s.state === 'playing' ? 'paused' : 'playing'));
  else if (service === 'volume_up') set(s.state, { volume_level: Math.min(1, +((s.attributes.volume_level || 0.3) + 0.05).toFixed(2)) });
  else if (service === 'volume_down') set(s.state, { volume_level: Math.max(0, +((s.attributes.volume_level || 0.3) - 0.05).toFixed(2)) });

      'automation.abrir_igreja_domingo': () => on('light.fachada_letreiro', 'light.estacionamento', 'light.hall_entrada', 'light.banheiros', 'light.recepcao'),

      'automation.expediente_seg_sex': () => on('light.administrativo', 'light.sala_pastoral', 'light.recepcao', 'light.circulacao'),

card.addEventListener('hass-more-info', (e) => {

});
card.setConfig({ title: 'Base Church', labels: true, mode: 'auto', height: '100%' });
push();
// Ganchos para testes: window.demo.set('palco', 'on', { rgb_color: [255,0,0] }) · window.demo.setAll(false)
window.demo = {
  states,
  set(key, state, attrs) {
    const id = card.entity(key) || key; const s = states[id]; if (!s) return false;

  },
  setAll(on) {
    for (const [id, s] of Object.entries(states)) {
      if (id.startsWith('light.') || id.startsWith('switch.')) s.state = on ? 'on' : 'off';
      else if (id.startsWith('media_player.')) s.state = on ? 'playing' : 'off';
      else if (id.startsWith('climate.')) s.state = on ? 'cool' : 'off';

// Controle de hora simulada (só na demo): anda o relógio e o sol
const TZ = 'America/Sao_Paulo';
const hora = document.getElementById('hora'), horaOut = document.getElementById('horaOut'), sky = document.getElementById('sky');
const skyCap = document.getElementById('skyCap'), skyThumb = document.getElementById('skyThumb'), skyBar = document.getElementById('skyBar');
const btnLive = document.getElementById('horaAgora'), liveTxt = document.getElementById('skyLiveTxt');
const markRise = document.getElementById('markRise'), markSet = document.getElementById('markSet');
const pad = (n) => String(n).padStart(2, '0');
const hhmm = (m) => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const minOf = (ts) => { const p = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date(ts)); return (+p.find((x) => x.type === 'hour').value % 24) * 60 + +p.find((x) => x.type === 'minute').value; };
const nowMin = () => minOf(Date.now());
let live = true, sunMin = { rise: 360, set: 1090 }, sunKey = '';
// nascer/pôr do sol reais vêm do próprio cartão (calculados pela latitude/longitude); sem eles usa ~06:00–18:10
function readSun() {
  const t = card._sunTimes; const r = t && t.rise ? minOf(t.rise) : 360, s = t && t.set ? minOf(t.set) : 1090;
  const key = r + '-' + s; if (key === sunKey) return; sunKey = key; sunMin = { rise: r, set: s };
  const f = (m) => m / 1439, cl = (m) => Math.max(0, Math.min(1439, m));

function period(m) {

function render() {

  const m = +hora.value, isDay = m >= sunMin.rise && m < sunMin.set;
  horaOut.textContent = hhmm(m);
  skyCap.textContent = (live ? 'Agora' : 'Simulado') + ' · ' + period(m);
  skyThumb.style.setProperty('--f', m / 1439); skyThumb.classList.toggle('night', !isDay);
  sky.classList.toggle('sim', !live);
  btnLive.classList.toggle('on', live); btnLive.setAttribute('aria-pressed', String(live));
  liveTxt.textContent = live ? 'Ao vivo' : 'Agora';
  btnLive.setAttribute('aria-label', live ? 'Hora ao vivo (relógio real)' : 'Voltar para a hora real (agora)');
  hora.setAttribute('aria-valuetext', hhmm(m) + (live ? ' (agora, ao vivo)' : ' (simulado)') + ', ' + period(m));
}
hora.value = nowMin();
hora.addEventListener('input', () => {
  live = false;
  const target = +hora.value, cur = nowMin();
  card.setSimTime(new Date(Date.now() + (target - cur) * 60000));
  render(); place();
});
btnLive.addEventListener('click', () => { live = true; card.setSimTime(null); hora.value = nowMin(); render(); });
setInterval(() => { if (live) { hora.value = nowMin(); } render(); }, 15000);
setTimeout(render, 600); setTimeout(render, 2500);
render();

// Ocultar/mostrar a faixa (lembra a escolha neste navegador)
const btnHide = document.getElementById('skyHide');
function setMin(on, save = true) {
  sky.classList.toggle('min', on);
  btnHide.setAttribute('aria-expanded', String(!on));
  btnHide.setAttribute('aria-label', on ? 'Mostrar a faixa da hora' : 'Ocultar a faixa da hora'); btnHide.title = on ? 'Mostrar' : 'Ocultar';
  if (save) try { localStorage.setItem('igreja3d-sky-min', on ? '1' : '0'); } catch (_) {}
  if (typeof place === 'function') place();
}
btnHide.addEventListener('click', (e) => { e.stopPropagation(); setMin(!sky.classList.contains('min')); });
sky.addEventListener('click', () => { if (sky.classList.contains('min')) setMin(false); });
// no celular começa recolhida (só a hora), a não ser que a pessoa já tenha aberto antes
const narrow = () => window.innerWidth < 600;
{ let saved = null; try { saved = localStorage.getItem('igreja3d-sky-min'); } catch (_) {}
  if (saved === '1' || (saved === null && narrow())) setMin(true, false); }

// Posiciona a faixa no alto: na mesma linha do HUD, entre o título e os botões, quando cabe (telas largas; estreita até 260 px);
// senão logo abaixo do HUD (título, botões e a trilha da Vista de cima) — menos quando a folha de baixo do cartão (tablet em pé) sobe
// até a faixa (altura cheia): aí fica no cartão do título, como no celular. Recalcula quando o layout muda.
function place() {
  const root = card.shadowRoot; if (!root) return;
  const hud = root.querySelector('.hud.top'); if (!hud) return;
  sky.style.width = '';
  const W = window.innerWidth, bw = sky.getBoundingClientRect().width;
  const title = hud.querySelector('.title'), btns = hud.querySelector('.btns');
  const tr = title && title.getBoundingClientRect(), br = btns && btns.getBoundingClientRect();
  let top, cx = W / 2;
  const gap = tr && br && Math.abs(tr.top - br.top) < 8 ? br.left - tr.right - 24 : 0, below = hud.getBoundingClientRect().bottom + 4;
  const dock = root.querySelector('.wrap.sheet .dock:not([hidden])'), up = dock && dock.getBoundingClientRect().top < below + sky.getBoundingClientRect().height + 8;   // folha alta: cobriria a faixa
  if (!narrow() && gap >= Math.min(bw, 260)) { if (gap < bw) sky.style.width = Math.round(gap) + 'px'; top = tr.top; cx = (tr.right + br.left) / 2; }
  else if ((narrow() || up) && tr) {
    // celular: nunca no meio da tela — recolhida, a pílula fica no canto do cartão do título; aberta, cobre o cartão do título
    if (sky.classList.contains('min')) { top = tr.top + 5; cx = tr.right - 6 - bw / 2; }
    else { sky.style.width = Math.round(tr.width) + 'px'; top = tr.top + Math.max(0, (tr.height - sky.getBoundingClientRect().height) / 2); cx = (tr.left + tr.right) / 2; }
  } else top = below;
  sky.style.top = Math.round(top) + 'px'; sky.style.left = Math.round(cx) + 'px';
}
setInterval(place, 400); addEventListener('resize', place); setTimeout(place, 300);
place();
</script>
